<!-- Supabase → Authentication → Email Templates → "Magic Link"   (used for every sign-in code)
     Subject:  Your Highs Business code: {{ .Token }} -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;color:#16202e">
  <h2 style="color:#0f3d5c;margin:0 0 4px">Highs Business</h2>
  <p>Your one-time code:</p>
  <p style="font-size:30px;font-weight:bold;letter-spacing:6px;font-family:monospace;background:#f4f5f7;padding:12px 16px;border-radius:8px;display:inline-block">{{ .Token }}</p>
  <p>Enter it on the page where you requested it. <a href="{{ .RedirectTo }}">Open that page</a>.</p>
  <p style="color:#7a8494;font-size:12px">The code expires in 15 minutes and works once. If you didn't try to sign in, someone may know your password — change it in My account.</p>
</div>
